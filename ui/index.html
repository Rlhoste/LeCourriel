<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courriel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ── App Shell ───────────────────────────────────────────────────────────── -->
<div id="app">

  <!-- Sidebar -->
  <nav id="sidebar">
    <div id="sidebar-logo">✉ Courriel</div>

    <button class="nav-btn active" data-panel="overview">Overview</button>
    <button class="nav-btn" data-panel="inbox">Inbox</button>
    <button class="nav-btn" data-panel="important">Important</button>
    <button class="nav-btn" data-panel="tasks">Tasks</button>
    <button class="nav-btn" data-panel="meetings">Meetings</button>
    <button class="nav-btn" data-panel="calendar">Calendar</button>
    <button class="nav-btn" data-panel="projects">Projects</button>

    <div class="nav-sep"></div>

    <button class="nav-btn" data-panel="sent">Sent</button>
    <button class="nav-btn" data-panel="drafts">Drafts</button>
    <button class="nav-btn" data-panel="trash">Trash</button>

    <div class="nav-spacer"></div>

    <button class="nav-btn" id="btn-refresh">↻ Refresh</button>
    <button class="nav-btn" id="btn-settings">⚙ Settings</button>
    <button class="nav-btn compose-btn" id="btn-compose">+ Compose</button>
  </nav>

  <!-- Main area -->
  <main id="main">

    <!-- Loading bar -->
    <div id="loading-bar" class="hidden"></div>

    <!-- ── Overview ────────────────────────────────────────────────────────── -->
    <section id="panel-overview" class="panel active">
      <header class="panel-header">
        <div>
          <div id="ov-greeting" class="greeting">Good morning.</div>
          <div id="ov-briefing" class="briefing">Loading…</div>
        </div>
      </header>

      <div id="ov-grid">
        <!-- Urgent + High -->
        <div class="ov-box" id="ov-urgent-box">
          <div class="ov-box-title">Urgent &amp; High</div>
          <div class="ov-box-body" id="ov-urgent-list"></div>
        </div>
        <!-- Deadlines -->
        <div class="ov-box" id="ov-deadlines-box">
          <div class="ov-box-title">Deadlines</div>
          <div class="ov-box-body" id="ov-deadlines-list"></div>
        </div>
        <!-- Tasks -->
        <div class="ov-box" id="ov-tasks-box">
          <div class="ov-box-title">Tasks</div>
          <div class="ov-box-body" id="ov-tasks-list"></div>
        </div>
        <!-- Meetings -->
        <div class="ov-box" id="ov-meetings-box">
          <div class="ov-box-title">Meetings</div>
          <div class="ov-box-body" id="ov-meetings-list"></div>
        </div>
      </div>

      <!-- Week strip -->
      <div id="ov-week-strip"></div>
    </section>

    <!-- ── Email list + reading pane (shared template) ────────────────────── -->
    <section id="panel-inbox"     class="panel split-panel"></section>
    <section id="panel-important" class="panel split-panel"></section>
    <!-- ── Tasks (kanban) ──────────────────────────────────────────────────── -->
    <section id="panel-tasks" class="panel">
      <header class="panel-header kanban-header">
        <span class="kanban-title">Tasks</span>
        <div id="kanban-boards" class="kanban-boards"></div>
      </header>
      <div id="kanban" class="kanban">
        <div class="kanban-col" data-status="todo">
          <div class="kanban-col-title">Todo <span class="kanban-count"></span></div>
          <div class="kanban-add">
            <input type="text" id="kanban-new-title" placeholder="+ Add a task…" />
          </div>
          <div class="kanban-cards"></div>
        </div>
        <div class="kanban-col" data-status="in_progress">
          <div class="kanban-col-title">In progress <span class="kanban-count"></span></div>
          <div class="kanban-cards"></div>
        </div>
        <div class="kanban-col" data-status="done">
          <div class="kanban-col-title">Done <span class="kanban-count"></span></div>
          <div class="kanban-cards"></div>
        </div>
        <div class="kanban-col" data-status="given_up">
          <div class="kanban-col-title">Given up <span class="kanban-count"></span></div>
          <div class="kanban-cards"></div>
        </div>
      </div>
    </section>
    <section id="panel-meetings"  class="panel split-panel"></section>
    <section id="panel-sent"      class="panel split-panel"></section>
    <section id="panel-drafts"    class="panel split-panel"></section>
    <section id="panel-trash"     class="panel split-panel"></section>

    <!-- ── Calendar ────────────────────────────────────────────────────────── -->
    <section id="panel-calendar" class="panel">
      <header class="panel-header">
        <span id="cal-title">Calendar</span>
        <div>
          <button class="icon-btn" id="cal-prev">&#8249;</button>
          <button class="icon-btn" id="cal-next">&#8250;</button>
        </div>
      </header>
      <div id="cal-grid"></div>
    </section>

    <!-- ── Projects ────────────────────────────────────────────────────────── -->
    <section id="panel-projects" class="panel">
      <div id="projects-layout">
        <div id="projects-sidebar">
          <button id="projects-new">+ New project</button>
          <div id="projects-new-form" class="hidden">
            <input type="text" id="projects-new-name" placeholder="Project name" />
            <select id="projects-new-urgency">
              <option value="normal">Normal</option>
              <option value="high">High</option>
            </select>
            <div id="projects-new-error"></div>
            <div class="projects-new-actions">
              <button id="projects-new-create">Create</button>
              <button id="projects-new-cancel">Cancel</button>
            </div>
          </div>
          <div id="projects-list"></div>
        </div>
        <div id="projects-detail" class="hidden">
          <div id="projects-detail-header">
            <div id="projects-detail-name"></div>
            <div id="projects-detail-urgency"></div>
          </div>
          <textarea id="projects-desc" placeholder="Project description…"></textarea>
          <button id="projects-save-desc">Save</button>
          <div id="projects-emails-list"></div>
        </div>
        <div id="projects-reading-pane" class="reading-pane hidden">
          <div id="proj-rp-header"></div>
          <iframe id="proj-rp-iframe" sandbox="allow-same-origin"></iframe>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- ── Compose Dialog ──────────────────────────────────────────────────────── -->
<!-- Floating composer (Compose / Reply / Forward) -->
<div id="composer" class="composer hidden">
  <div class="composer-resize" title="Drag to resize"></div>
  <div class="composer-header">
    <span id="composer-title">New Message</span>
    <div class="composer-header-btns">
      <button id="composer-min" title="Minimise">&#8211;</button>
      <button id="composer-max" title="Expand">&#10530;</button>
      <button id="composer-close" title="Close">&#10005;</button>
    </div>
  </div>
  <div class="composer-main">
    <div class="composer-field">
      <label for="compose-to">To</label>
      <input type="text" id="compose-to" autocomplete="off" />
      <button class="composer-link" id="compose-show-cc">Cc</button>
      <button class="composer-link" id="compose-show-bcc">Bcc</button>
    </div>
    <div class="composer-field hidden" id="compose-cc-row">
      <label for="compose-cc">Cc</label>
      <input type="text" id="compose-cc" autocomplete="off" />
    </div>
    <div class="composer-field hidden" id="compose-bcc-row">
      <label for="compose-bcc">Bcc</label>
      <input type="text" id="compose-bcc" autocomplete="off" />
    </div>
    <div class="composer-field">
      <input type="text" id="compose-subject" placeholder="Subject" />
    </div>

    <div id="compose-body" class="composer-body" contenteditable="true" spellcheck="true"></div>

    <div class="composer-toolbar" id="composer-toolbar">
      <select data-cmd="fontName" title="Font">
        <option value="Arial, Helvetica, sans-serif">Sans Serif</option>
        <option value="Georgia, 'Times New Roman', serif">Serif</option>
        <option value="'Courier New', Courier, monospace">Fixed width</option>
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="'Times New Roman'">Times New Roman</option>
        <option value="Verdana">Verdana</option>
        <option value="'Courier New'">Courier New</option>
      </select>
      <select data-cmd="fontSize" title="Size">
        <option value="1">Small</option>
        <option value="3" selected>Normal</option>
        <option value="5">Large</option>
        <option value="7">Huge</option>
      </select>
      <span class="tb-sep"></span>
      <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
      <button data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
      <div class="tb-pop-wrap">
        <button id="tb-color" title="Text colour"><span class="tb-color-a">A</span></button>
        <div class="tb-pop hidden" id="tb-color-pop"></div>
      </div>
      <span class="tb-sep"></span>
      <button data-cmd="justifyLeft" title="Align left">&#8676;</button>
      <button data-cmd="justifyCenter" title="Centre">&#8596;</button>
      <button data-cmd="justifyRight" title="Align right">&#8677;</button>
      <button data-cmd="justifyFull" title="Justify">&#9776;</button>
      <span class="tb-sep"></span>
      <button data-cmd="insertUnorderedList" title="Bulleted list">&#8226;&#8801;</button>
      <button data-cmd="insertOrderedList" title="Numbered list">1&#8801;</button>
      <button data-cmd="outdent" title="Decrease indent">&#8676;&#8801;</button>
      <button data-cmd="indent" title="Increase indent">&#8801;&#8677;</button>
      <button data-cmd="blockquote" title="Quote">&#10077;</button>
      <span class="tb-sep"></span>
      <div class="tb-pop-wrap">
        <button id="tb-link" title="Insert link">&#128279;</button>
        <div class="tb-pop tb-link-pop hidden" id="tb-link-pop">
          <input type="text" id="tb-link-text" placeholder="Text to display" />
          <input type="text" id="tb-link-url" placeholder="https://…" />
          <div class="tb-link-actions">
            <button id="tb-link-remove" class="composer-link">Remove link</button>
            <button id="tb-link-ok" class="composer-send">OK</button>
          </div>
        </div>
      </div>
      <button id="tb-image" title="Insert image">&#128444;</button>
      <input type="file" id="tb-image-file" accept="image/*" hidden />
      <div class="tb-pop-wrap">
        <button id="tb-gif" class="tb-gif-btn" title="Insert GIF">GIF</button>
        <div class="tb-pop tb-gif-pop hidden" id="tb-gif-pop">
          <input type="text" id="tb-gif-search" placeholder="Search GIFs…" autocomplete="off" />
          <div class="tb-gif-grid" id="tb-gif-grid"></div>
          <div class="tb-gif-footer">
            <span id="tb-gif-status"></span>
            <span class="tb-gif-attrib">Powered by GIPHY</span>
          </div>
        </div>
      </div>
      <button data-cmd="removeFormat" title="Remove formatting">T&#824;</button>
      <span class="tb-sep"></span>
      <div class="tb-pop-wrap">
        <button id="tb-ai" class="tb-ai-btn" title="AI writing tools">&#10024; AI</button>
        <div class="tb-pop tb-ai-pop hidden" id="tb-ai-pop">
          <button data-ai="formal">Make it formal</button>
          <button data-ai="translate_en">Translate to English</button>
          <button data-ai="correct">Correct spelling &amp; grammar</button>
          <button data-ai="auto_reply" id="tb-ai-auto">Auto answer</button>
          <div class="tb-ai-hint">Works on the selected text, or on your whole message.</div>
        </div>
      </div>
    </div>

    <div class="composer-footer">
      <button id="compose-send" class="composer-send" title="Send (Ctrl+Enter)">Send</button>
      <span id="compose-status" class="composer-status"></span>
      <div id="compose-discard-confirm" class="composer-confirm hidden">
        Discard draft? <button id="compose-discard-yes" class="composer-link">Discard</button>
        <button id="compose-discard-no" class="composer-link">Keep</button>
      </div>
      <button id="compose-discard" class="composer-icon" title="Discard draft">&#128465;</button>
    </div>
  </div>
</div>

<!-- ── Settings Dialog ─────────────────────────────────────────────────────── -->
<div id="settings-overlay" class="overlay hidden">
  <div class="dialog wide-dialog">
    <div class="dialog-header">
      <span>Settings</span>
      <button class="close-btn" id="settings-close">✕</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="general">General</button>
      <button class="tab" data-tab="accounts">Accounts</button>
      <button class="tab" data-tab="ai">AI</button>
    </div>

    <!-- General -->
    <div class="tab-content active" id="tab-general">
      <label>Display Name</label>
      <input type="text" id="s-display-name" />
      <label>Font Scale</label>
      <input type="range" id="s-font-scale" min="0.7" max="1.8" step="0.05" />
      <span id="s-font-scale-val">1.0×</span>
    </div>

    <!-- Accounts -->
    <div class="tab-content" id="tab-accounts">
      <div id="s-accounts-container"></div>
      <button id="s-add-account" class="secondary-btn">+ Add Account</button>
    </div>

    <!-- AI -->
    <div class="tab-content" id="tab-ai">
      <label>Claude API Key</label>
      <input type="password" id="s-claude-key" />
      <label>Model</label>
      <input type="text" id="s-claude-model" placeholder="claude-sonnet-4-6" />
      <label>GIPHY API Key <span style="opacity:.7">(for the GIF picker — free at developers.giphy.com)</span></label>
      <input type="password" id="s-giphy-key" />
      <div style="margin-top:16px">
        <button id="s-show-qr" class="secondary-btn">Show QR Code</button>
        <pre id="s-qr-output" style="font-size:0.6rem;display:none"></pre>
      </div>
    </div>

    <div class="dialog-actions">
      <button id="settings-save" class="primary-btn">Save</button>
    </div>
  </div>
</div>

<!-- Reading pane (shared for email panels) -->
<template id="tpl-split-panel">
  <div class="email-list-col">
    <div class="list-header">
      <span class="list-title"></span>
      <span class="list-count"></span>
    </div>
    <div class="email-list"></div>
  </div>
  <div class="reading-pane">
    <div class="rp-placeholder">Select an email to read</div>
    <div class="rp-content hidden">
      <div class="rp-header">
        <div class="rp-subject"></div>
        <div class="rp-meta"></div>
        <div class="rp-actions"></div>
      </div>
      <iframe class="rp-iframe" sandbox="allow-same-origin"></iframe>
    </div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
